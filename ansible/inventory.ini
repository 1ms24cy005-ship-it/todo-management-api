# Ansible Inventory targeting active Linux systemd node on Minikube
[app_servers]
minikube_linux ansible_host=127.0.0.1 ansible_port=32768 ansible_user=docker ansible_ssh_private_key_file=/Users/aditi/.minikube/machines/minikube/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[app_servers:vars]
ansible_connection=ssh
ansible_become=true
ansible_become_method=sudo
