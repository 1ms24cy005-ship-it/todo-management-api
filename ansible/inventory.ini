# Ansible Inventory for Todo Management REST API Deployment
# Specifies target Linux hosts (VMs, cloud instances, or Linux containers)

[app_servers]
# Target Linux host (Ubuntu/Debian or RHEL/CentOS)
# Update ansible_host with your target VM/server IP address or domain
todo_server ansible_host=192.168.64.5 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3

[app_servers:vars]
ansible_connection=ssh
ansible_become=true
ansible_become_method=sudo
